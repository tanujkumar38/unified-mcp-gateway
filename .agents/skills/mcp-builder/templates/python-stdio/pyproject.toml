[project]
name = "mcp-server-template-python"
version = "1.0.0"
description = "Production-ready Python Model Context Protocol (MCP) Server using FastMCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-server = "server:main"
